# Claims that were proposed at some point and MUST NOT be used.
forbidden_claims:
  - claim: "Claude Corps Fellow (or any title not actually held)"
    reason: "Claiming a title the candidate does not hold."
  - claim: "Analyzed Oil & Gas datasets for government agencies"
    reason: "The SAFETECHNO clients were not government agencies. Suggested by a scoring tool; it is a lie."
  - claim: "Volunteer work with local community organizations (plural / generic)"
    reason: "One specific NGO, two months. Generalizing inflates it."
  - claim: "Professional Development: Onboarding Bootcamp with Anthropic"
    reason: "A perk that would be received if hired, not an accomplishment."
  - claim: "Reframing the KDDCup 1999 work as public-health outbreak prediction on anonymized health records"
    reason: "KDDCup 1999 is a network-intrusion dataset and the linked IJSRD paper disproves the reframing."
  - claim: "Relevant coursework: Public Health Data Analysis / Civic Technology Applications"
    reason: "Invented course titles."
  - claim: "Implemented evals to cut inference cost ~40%"
    reason: "False causality. Token budgeting and model routing cut the cost, not evals."
  - claim: "HealthMate-AI built with agent frameworks"
    reason: "HealthMate-AI is RAG, not agents."
  - claim: "fine-tuned sentence-transformer ensemble model"
    reason: "The 'ensemble' descriptor was dropped as inaccurate."
  - claim: "Any Forage program starter repo presented as original work"
    reason: "forage-walmart-task-4 and forage-midas are forks of provided starter repos."

